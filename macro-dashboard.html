function renderSnapshot(){
  var snapData=D.snapshots;
  var byCat={}; snapData.forEach(function(s){var c=s.category||'Other';(byCat[c]=byCat[c]||[]).push(s);});
  var cats=Object.keys(byCat).sort();
  if(!cats.length){document.getElementById('tab-snapshot').innerHTML='<div class="emp"><div class="big">—</div>暂无快照数据</div>';return;}
  var html='<div class="snap-grid">';
  cats.forEach(function(cat){
    var cc=D.catColors[cat]||'#64748b', cn=D.catCN&&D.catCN[cat]?D.catCN[cat]:cat, items=byCat[cat];
    html+='<div class="cat-card"><div class="cat-hd"><span class="cat-dot" style="background:'+cc+'"></span><span class="cat-title" style="color:'+cc+'">'+esc(cn)+'</span><span class="cat-cnt">'+items.length+'项</span></div><div class="cat-body">';
    items.forEach(function(s){
      var dir=s.direction||'flat', di=dir==='up'?'↑':dir==='down'?'↓':'↔', dc=dir==='up'?'du':dir==='down'?'dd':'df';
      var bc=D.brokerColors[s.broker]||'#64748b', dp=s.display||s.indicator, r=s.macro_region||'Global';
      html+='<div class="ind-row" data-region="'+esc(r)+'"><span class="db '+dc+'">'+di+'</span><span class="ind-name" title="'+esc(dp)+'">'+esc(dp)+'</span><span class="ind-val">'+(s.value!=null?s.value:'—')+'</span><span class="ind-unit">'+esc(s.unit||'')+'</span><span class="ind-bk" style="color:'+bc+'">'+esc(s.broker)+'</span></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('tab-snapshot').innerHTML=html;
  applySnapRegionFilter();
}
function applySnapRegionFilter(){
  document.querySelectorAll('#tab-snapshot .ind-row').forEach(function(r){r.style.display=(regionFilter!=='all'&&r.getAttribute('data-region')!==regionFilter)?'none':'';});
  document.querySelectorAll('#tab-snapshot .cat-card').forEach(function(c){
    var allHidden=true; c.querySelectorAll('.ind-row').forEach(function(r){if(r.style.display!=='none')allHidden=false;});
    c.style.display=allHidden?'none':'';
  });
}
function applyOutlookRegionFilter(){
  document.querySelectorAll('#tab-outlook .ot-card').forEach(function(c){
    var anyVis=false; c.querySelectorAll('tbody tr').forEach(function(r){
      var hide=(regionFilter!=='all'&&c.getAttribute('data-region')!==regionFilter)||r.getAttribute('data-no-forecast')==='true';
      r.style.display=hide?'none':''; if(!hide) anyVis=true;
    });
    c.style.display=anyVis?'':'none';
  });
}
function setRegionFilter(reg,btn){
  regionFilter=reg; document.querySelectorAll('.reg-flt').forEach(function(b){b.classList.remove('on');}); btn.classList.add('on');

}

    entries.forEach(function(e){
      var bc=D.brokerColors[e.broker]||'#64748b';
      var di=e.direction==='up'?'↑':e.direction==='down'?'↓':'↔', dcl=e.direction==='up'?'du':e.direction==='down'?'dd':'df';
      var cval=e.current!=null?e.current.toFixed(2):'—';
      var fval; if(e.forecast!=null){fval=e.forecast.toFixed(2)+' <span style="font-size:9px;color:#94a3b8;font-weight:400">'+esc(un)+'</span>';}else{var dl=e.direction==='up'?'↑ 看多':e.direction==='down'?'↓ 看空':'→ 中性'; fval='<span style="color:#f59e0b;font-weight:600;font-size:11px">'+dl+'</span><span style="font-size:9px;color:#94a3b8;margin-left:2px">定性</span>';}
      var dh='<span style="color:#94a3b8">—</span>';
      if(e.delta!=null){var isUp=e.delta>0,isDn=e.delta<0,dcls=isUp?'delta-up':isDn?'delta-down':'delta-zero';var sign=e.delta>0?'+':'',ds=sign+e.delta.toFixed(3);if(e.delta_pct!=null)ds+=' ('+(e.delta_pct>0?'+':'')+e.delta_pct.toFixed(1)+'%)';dh='<span class="delta '+dcls+'">'+ds+'</span>';if(e.prev_date)dh+=' <span style="font-size:9px;color:#94a3b8">vs '+esc(e.prev_date.slice(5))+'</span>';}
      var noFcst=e.forecast==null?' data-no-forecast="true"':'';
      html+='<tr'+noFcst+'><td class="tc-bk" style="color:'+bc+'">'+esc(e.broker)+'</td><td class="tc-cv">'+cval+'</td><td class="tc-arrow">→</td><td class="tc-fore">'+fval+'</td><td class="tc-delta">'+dh+'</td><td class="tc-hz">'+esc(e.horizon)+'</td><td class="tc-dir"><span class="db '+dcl+'">'+di+'</span></td><td class="tc-date">'+esc(e.date.slice(5))+'</td></tr>';
    });
    html+='</tbody></table>';
    var iid=ind.replace(/[^a-zA-Z0-9一-鿿]/g,'-');
    html+='<div class="tr-bar"><button class="tr-btn" data-trend="'+iid+'">▼ 趋势图</button><span class="tr-sum" id="trsum-'+iid+'"></span></div>';
    html+='<div class="tr-chart" id="trchart-'+iid+'" style="display:none"></div></div>';
  });
  html+='</div>';
  document.getElementById('tab-outlook').innerHTML=html;
  applyOutlookRegionFilter();
}

// ===== 趋势图 toggle =====
document.addEventListener('click',function(e){
  var btn=e.target.closest('.tr-btn'); if(!btn)return;
  var tid=btn.getAttribute('data-trend'), chartDiv=document.getElementById('trchart-'+tid);
  if(!chartDiv)return;
  if(chartDiv.style.display==='block'){chartDiv.style.display='none';btn.classList.remove('on');return;}
  btn.classList.add('on'); chartDiv.style.display='block';
  drawTrend(tid,chartDiv,btn);
});

function drawTrend(indicatorId, div, btn){
  // 找到对应指标的数据
  var indKeys=Object.keys(D.outlooks);
  var indKey='';
  for(var i=0;i<indKeys.length;i++){
    if(indKeys[i].replace(/[^a-zA-Z0-9一-鿿]/g,'-')===indicatorId){indKey=indKeys[i];break;}
  }
  if(!indKey){div.innerHTML='<div style="color:#94a3b8;font-size:11px">暂无趋势数据</div>';return;}
  var hist=D.history[indKey], entries=D.outlooks[indKey];
  if(!hist||!Object.keys(hist).length){div.innerHTML='<div style="color:#94a3b8;font-size:11px">暂无趋势数据</div>';return;}

  // 收集所有数据点，找到全局 min/max
  var allPts=[], allDates=[];
  Object.keys(hist).forEach(function(bk){
    var pts=hist[bk];
    pts.forEach(function(p){allPts.push(p.value);allDates.push(p.date);});
  });
  var dates=[...new Set(allDates)].sort();
  var minV=Math.min.apply(null,allPts), maxV=Math.max.apply(null,allPts);
  if(minV===maxV){minV-=1;maxV+=1;}
  var pad=(maxV-minV)*0.1; minV-=pad; maxV+=pad;

  var W=Math.max(340,dates.length*72), H=150, LM=42, RM=20, TM=16, BM=28;
  var plotW=W-LM-RM, plotH=H-TM-BM;

  var svg='<svg width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">';
  // Grid lines
  var grids=4;
  for(var g=0;g<=grids;g++){
    var y=TM+(plotH*g/grids);
    svg+='<line x1="'+LM+'" y1="'+y+'" x2="'+(W-RM)+'" y2="'+y+'" class="gl"/>';
    var v=minV+(maxV-minV)*(grids-g)/grids;
    svg+='<text x="'+(LM-4)+'" y="'+(y+3)+'" text-anchor="end" class="al">'+v.toFixed(2)+'</text>';
  }
  // Date labels
  var step=Math.max(1,Math.floor(dates.length/6));
  dates.forEach(function(d,i){
    var x=LM+(plotW*i/(dates.length-1||1));
    svg+='<line x1="'+x+'" y1="'+TM+'" x2="'+x+'" y2="'+(H-BM)+'" class="dm"/>';
    if(i%step===0||i===dates.length-1) svg+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" class="al">'+d.slice(5)+'</text>';
  });
  // Lines & dots per broker
  var bks=Object.keys(D.brokerColors);
  bks.forEach(function(bk){
    if(!hist[bk])return;
    var pts=hist[bk], bc=D.brokerColors[bk];
    var ptsStr='';
    pts.forEach(function(p){
      var di=dates.indexOf(p.date);
      if(di<0)return;
      var x=LM+(plotW*di/(dates.length-1||1)), y=TM+(plotH*(1-(p.value-minV)/(maxV-minV)));
      ptsStr+=' '+x+','+y;
      svg+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+bc+'" stroke="#fff" class="bd"><title>'+bk+': '+p.value.toFixed(3)+' ('+p.date+')</title></circle>';
    });
    if(ptsStr) svg+='<polyline points="'+ptsStr.trim()+'" class="bl" style="stroke:'+bc+'"/>';
  });
  svg+='</svg>';
  div.innerHTML=svg;
}

</script>
