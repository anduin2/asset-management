// ===== 市场快照 - 按品类分组卡片 =====
function renderSnapshot(){
  var byCat={};
  D.snapshots.forEach(function(s){
    var cat=s.category||'Other'; if(!byCat[cat])byCat[cat]=[]; byCat[cat].push(s);
  });
  var cats=Object.keys(byCat).sort();
  if(!cats.length){document.getElementById('tab-snapshot').innerHTML='<div class="emp"><div class="big">—</div>今日暂无快照数据</div>';return;}
  var html='<div class="snap-grid">';
  cats.forEach(function(cat){
    var cc=D.catColors[cat]||'#64748b', cn=D.catCN&&D.catCN[cat]?D.catCN[cat]:cat;
    html+='<div class="cat-card"><div class="cat-hd"><span class="cat-dot" style="background:'+cc+'"></span><span class="cat-title" style="color:'+cc+'">'+esc(cn)+'</span><span class="cat-cnt">'+byCat[cat].length+'项</span></div><div class="cat-body">';
    byCat[cat].forEach(function(s){
      var dir=s.direction||'flat', di=dir==='up'?'↑':dir==='down'?'↓':'↔', dc=dir==='up'?'du':dir==='down'?'dd':'df';
      var bc=D.brokerColors[s.broker]||'#64748b', dp=s.display||s.indicator;
      html+='<div class="ind-row"><span class="db '+dc+'">'+di+'</span><span class="ind-name" title="'+esc(dp)+'">'+esc(dp)+'</span><span class="ind-val">'+(s.value!=null?s.value:'—')+'</span><span class="ind-unit">'+esc(s.unit||'')+'</span><span class="ind-bk" style="color:'+bc+'">'+esc(s.broker)+'</span><span class="ind-dt">'+esc(s.date.slice(5))+'</span></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('tab-snapshot').innerHTML=html;
}

// ===== 展望追踪 =====
function renderOutlook(){
  var outlooks=D.outlooks, indicators=Object.keys(outlooks).sort();
  if(!indicators.length){document.getElementById('tab-outlook').innerHTML='<div class="emp"><div class="big">—</div>今日暂无展望数据</div>';return;}
  var html='<div class="oc-grid">';
  indicators.forEach(function(ind){
    var entries=outlooks[ind]; if(!entries||!entries.length)return;
    var cat=entries[0].category||'Other', cc=D.catColors[cat]||'#2563eb';
    var dp=entries[0].display_name||ind, un=entries[0].unit||'';
    // 共识方向
    var dc={up:0,down:0,flat:0}; entries.forEach(function(e){dc[e.direction||'flat']=(dc[e.direction||'flat']||0)+1;});
    var cd='neutral',cl='↔ 中性';
    if(dc.up>=dc.down&&dc.up>dc.flat){cd='bullish';cl='↑ 偏多';}
    else if(dc.down>dc.up&&dc.down>dc.flat){cd='bearish';cl='↓ 偏空';}

    html+='<div class="ot-card"><div class="ot-hd"><span class="ot-hd-nm">'+esc(dp)+'</span><span class="ot-hd-cat" style="background:'+cc+'">'+esc(cat)+'</span><span class="ot-hd-cons '+cd+'">'+cl+'</span></div>';
    // Table
    html+='<table class="ot-table"><thead><tr><th>券商</th><th>当前值</th><th></th><th>展望值</th><th class="tac">相对上次变化</th><th>展望期</th><th class="tac">方向</th></tr></thead><tbody>';
    entries.forEach(function(e){
      var bc=D.brokerColors[e.broker]||'#64748b';
      var di=e.direction==='up'?'↑':e.direction==='down'?'↓':'↔', dcl=e.direction==='up'?'du':e.direction==='down'?'dd':'df';
      var cval=e.current!=null?e.current.toFixed(2):'—', fval=e.forecast!=null?e.forecast.toFixed(2):'—';
      // Delta
      var dh='<span style="color:#94a3b8">—</span>';
      if(e.delta!=null){
        var isUp=e.delta>0,isDn=e.delta<0, dcls=isUp?'delta-up':isDn?'delta-down':'delta-zero';
        var sign=e.delta>0?'+':'', ds=sign+e.delta.toFixed(3);
        if(e.delta_pct!=null)ds+=' ('+(e.delta_pct>0?'+':'')+e.delta_pct.toFixed(1)+'%)';
        dh='<span class="delta '+dcls+'">'+ds+'</span>';
        if(e.prev_date)dh+=' <span style="font-size:9px;color:#94a3b8">vs '+esc(e.prev_date.slice(5))+'</span>';
      }
      html+='<tr><td class="tc-bk" style="color:'+bc+'">'+esc(e.broker)+'</td><td class="tc-cv">'+cval+'</td><td class="tc-arrow">→</td><td class="tc-fore">'+fval+' <span style="font-size:9px;color:#94a3b8;font-weight:400">'+esc(un)+'</span></td><td class="tac">'+dh+'</td><td class="tc-hz">'+esc(e.horizon)+'</td><td class="tc-dir"><span class="db '+dcl+'">'+di+'</span></td></tr>';
    });
    html+='</tbody></table>';

    // Trend bar
    var iid=ind.replace(/[^a-zA-Z0-9一-鿿]/g,'-');
    html+='<div class="tr-bar"><button class="tr-btn" data-trend="'+iid+'">▼ 趋势图</button><span class="tr-sum" id="trsum-'+iid+'"></span></div>';
    html+='<div class="tr-chart" id="trchart-'+iid+'" style="display:none"></div>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('tab-outlook').innerHTML=html;
}

// ===== 趋势图 toggle =====
document.addEventListener('click',function(e){
  var btn=e.target.closest('.tr-btn'); if(!btn)return;
  var tid=btn.getAttribute('data-trend'), chartDiv=document.getElementById('trchart-'+tid);
  if(!chartDiv)return;
  if(chartDiv.style.display==='block'){chartDiv.style.display='none';btn.classList.remove('on');return;}
  btn.classList.add('on'); chartDiv.style.display='block';
  drawTrend(tid,chartDiv,btn);
});

function drawTrend(indicatorId, div, btn){
  // 找到对应指标的数据
  var indKeys=Object.keys(D.outlooks);
  var indKey='';
  for(var i=0;i<indKeys.length;i++){
    if(indKeys[i].replace(/[^a-zA-Z0-9一-鿿]/g,'-')===indicatorId){indKey=indKeys[i];break;}
  }
  if(!indKey){div.innerHTML='<div style="color:#94a3b8;font-size:11px">暂无趋势数据</div>';return;}
  var hist=D.history[indKey], entries=D.outlooks[indKey];
  if(!hist||!Object.keys(hist).length){div.innerHTML='<div style="color:#94a3b8;font-size:11px">暂无趋势数据</div>';return;}

  // 收集所有数据点，找到全局 min/max
  var allPts=[], allDates=[];
  Object.keys(hist).forEach(function(bk){
    var pts=hist[bk];
    pts.forEach(function(p){allPts.push(p.value);allDates.push(p.date);});
  });
  var dates=[...new Set(allDates)].sort();
  var minV=Math.min.apply(null,allPts), maxV=Math.max.apply(null,allPts);
  if(minV===maxV){minV-=1;maxV+=1;}
  var pad=(maxV-minV)*0.1; minV-=pad; maxV+=pad;

  var W=Math.max(340,dates.length*72), H=150, LM=42, RM=20, TM=16, BM=28;
  var plotW=W-LM-RM, plotH=H-TM-BM;

  var svg='<svg width="'+W+'" height="'+H+'" xmlns="http://www.w3.org/2000/svg">';
  // Grid lines
  var grids=4;
  for(var g=0;g<=grids;g++){
    var y=TM+(plotH*g/grids);
    svg+='<line x1="'+LM+'" y1="'+y+'" x2="'+(W-RM)+'" y2="'+y+'" class="gl"/>';
    var v=minV+(maxV-minV)*(grids-g)/grids;
    svg+='<text x="'+(LM-4)+'" y="'+(y+3)+'" text-anchor="end" class="al">'+v.toFixed(2)+'</text>';
  }
  // Date labels
  var step=Math.max(1,Math.floor(dates.length/6));
  dates.forEach(function(d,i){
    var x=LM+(plotW*i/(dates.length-1||1));
    svg+='<line x1="'+x+'" y1="'+TM+'" x2="'+x+'" y2="'+(H-BM)+'" class="dm"/>';
    if(i%step===0||i===dates.length-1) svg+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" class="al">'+d.slice(5)+'</text>';
  });
  // Lines & dots per broker
  var bks=Object.keys(D.brokerColors);
  bks.forEach(function(bk){
    if(!hist[bk])return;
    var pts=hist[bk], bc=D.brokerColors[bk];
    var ptsStr='';
    pts.forEach(function(p){
      var di=dates.indexOf(p.date);
      if(di<0)return;
      var x=LM+(plotW*di/(dates.length-1||1)), y=TM+(plotH*(1-(p.value-minV)/(maxV-minV)));
      ptsStr+=' '+x+','+y;
      svg+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+bc+'" stroke="#fff" class="bd"><title>'+bk+': '+p.value.toFixed(3)+' ('+p.date+')</title></circle>';
    });
    if(ptsStr) svg+='<polyline points="'+ptsStr.trim()+'" class="bl" style="stroke:'+bc+'"/>';
  });
  svg+='</svg>';
  div.innerHTML=svg;
}
