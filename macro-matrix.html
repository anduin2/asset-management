<style>
  *{margin:0;padding:0;box-sizing:border-box}

  /* ===== 日期选择栏 ===== */
  .date-bar{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding:10px 16px;background:#f8f9fb;border:1px solid #dde3ea;border-radius:6px;font-size:13px}

  .date-bar .no-data-msg{color:#c66;font-size:12.5px;margin-left:6px;display:none}
  .date-bar .nav-btn{padding:4px 12px;border:1px solid #c5cdd8;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit}
  .date-bar .nav-btn:hover{background:#eef0f4}

  /* ===== Header ===== */
  .header{margin-bottom:36px}
  .header h1{font-size:22px;color:#0a2647;margin-bottom:4px}
  .header .sub{font-size:13px;color:#888;margin-left:10px;font-weight:400}
  .header .meta{margin-top:8px;font-size:13px;color:#666;line-height:1.6}
  .header .brokers{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
  .header .brokers span{padding:3px 12px;border-radius:4px;font-size:11px;font-weight:700;color:#fff}
  .b-gs{background:#7395c9}.b-ms{background:#005594}.b-jpm{background:#0072bc}.b-bofa{background:#c41e3a}.b-citi{background:#003B70}.b-none{background:#bbb;color:#555}.b-barclays{background:#00AEEF}.b-jefferies{background:#007A33}.b-hsbc{background:#DB0011}.b-td{background:#20B24A}.b-db{background:#0018A8}.b-bmo{background:#0079C1}.b-js{background:#8E44AD}.b-ubs{background:#EC0000}.b-ca{background:#0E7A5F}

  /* ===== 市场标题 ===== */
  h2{
    font-size:16px;padding:9px 14px;background:#0a2647;color:#fff;font-weight:600;
    margin:48px 0 14px;letter-spacing:.3px;
  }
  h2 .note{font-weight:400;font-size:12px;color:#bcc9d9;margin-left:10px}
  h2.priority{border-left:5px solid #f0b90b;padding-left:9px}
  h2:first-of-type{margin-top:0}

  /* ===== 市场摘要框 ===== */
  .summary-bar{
    padding:10px 16px;background:#f4f7fa;border:1px solid #dde3ea;
    margin:0 0 12px;font-size:13px;color:#3a4450;line-height:1.7;
  }
  .summary-bar b{color:#0a2647}

  /* ===== 表格 ===== */
  table{width:100%;border-collapse:collapse;margin:0 0 0;font-size:13px;table-layout:fixed}
  th{background:#e9edf3;color:#0a2647;padding:9px 10px;text-align:left;font-weight:700;font-size:12px;white-space:nowrap;border:1px solid #d0d5dd}
  td{padding:9px 10px;border:1px solid #e2e6ed;vertical-align:top;word-break:break-word;line-height:1.6}
  tr:nth-child(even) td{background:#fafbfd}
  td:first-child{font-weight:700;color:#0a2647;white-space:nowrap;text-align:center;vertical-align:middle;background:#f8f9fb;padding:6px 8px;font-size:12px}
  td:empty::after{content:"—";color:#bbb}

  /* 左线三色 */
  td.long{border-left:4px solid #2e7d32;padding-left:7px}
  td.short{border-left:4px solid #c62828;padding-left:7px}
  td.fact{border-left:2px solid #a8b2c0;padding-left:8px}

  /* 文字高亮 */
  .bull{color:#2e7d32;font-weight:600}
  .bear{color:#c62828;font-weight:600}

  /* ===== 无覆盖市场汇总 ===== */
  .section-empty{
    margin:3px 0;padding:6px 14px;background:#f8f9fb;border:1px solid #eef0f3;
    font-size:12.5px;color:#99a;display:block;
  }
  .empty-summary-bar{
    margin:48px 0 0;padding:8px 16px;background:#f2f3f6;border:1px solid #dde0e6;
    font-size:13px;color:#778;cursor:pointer;user-select:none;display:inline-block;
  }
  .empty-summary-bar:hover{background:#e6e9ee}
  .empty-summary-bar .toggle-icon{font-size:10px;margin-right:4px;color:#999}
  .empty-summary-bar .empty-count{color:#aaa;font-weight:400}
  .empty-summary-list{margin:0 0 0 8px;border-left:2px solid #e5e8ed;padding:6px 0 0 9px}

  /* ===== 重点分歧 ===== */
  .divergence{margin-top:48px}
  .divergence h2{background:#d4a017;color:#fff}
  .divergence table{margin:0}
  .divergence th{background:#d4a017;color:#fff}
  .divergence td{font-size:12.5px;line-height:1.6}

  /* ===== Footer ===== */
  .footer{margin-top:48px;padding-top:16px;border-top:1px solid #dde;color:#99a;font-size:11px;display:flex;gap:32px;flex-wrap:wrap}
</style>

// ==================================================================
// 渲染引擎
// ==================================================================

function tr(cls,html){return '<td class="'+cls+'">'+html+'</td>'}
function emptyRow(n){return '<td></td>'.repeat(n)}

function renderDay(date){
  var app=document.getElementById('app');
  var d=REPORT_DATA[date];
  document.getElementById('noDataMsg').style.display=d?'none':'inline-block';

  if(!d){
    app.innerHTML='<div style="text-align:center;padding:80px 0;color:#aaa;font-size:15px">该日期暂无数据。请选择其他日期或新增数据。</div>';
    return;
  }

  var brokers=d.brokers.map(function(b){return '<span class="'+b.c+'">'+b.n+'</span>'}).join('');

  var html='';
  // Header
  html+='<div class="header">';
  html+='<h1>固定收益 Morning Research Digest <span class="sub">'+d.dateCN+' · '+d.theme+'</span></h1>';
  html+='<div class="meta">'+d.meta+'</div>';
  html+='<div class="brokers">'+brokers+'</div>';
  html+='</div>';

  // Markets（以表头列数为准强制对齐，防止 rows cell 数漂移导致串列/偏移）
  d.markets.forEach(function(m){
    html+='<h2'+(m.pri?' class="priority"':'')+'>'+m.title+(m.note?' <span class="note">'+m.note+'</span>':'')+'</h2>';
    if(m.summary){
      html+='<div class="summary-bar">'+m.summary+'</div>';
    }
    var nCols=m.headers.length;
    if(!m.cols||m.cols.length!==nCols)console.warn('[日报] '+date+' 「'+m.title+'」 cols列数('+(m.cols?m.cols.length:0)+')≠headers列数('+nCols+')');
    html+='<table><colgroup>';
    for(var c=0;c<nCols;c++){html+='<col style="width:'+((m.cols&&m.cols[c])||'auto')+'">'};
    html+='</colgroup><tr>';
    m.headers.forEach(function(h){html+='<th>'+h+'</th>'});
    html+='</tr>';
    m.rows.forEach(function(row){
      if(row.length!==nCols)console.warn('[日报] '+date+' 「'+m.title+'」 行cell数('+row.length+')≠表头('+nCols+')，已自动对齐');
      html+='<tr>';
      var c0=row[0];
      if(Array.isArray(c0))c0=c0[1]||c0[0]||'';
      html+='<td>'+(c0||'')+'</td>';
      for(var i=1;i<nCols;i++){
        var cell=row[i];
        if(cell==null||cell==='')cell=[];
        if(typeof cell==='string')cell=['',cell];
        html+=tr(cell[0]||'',cell[1]||'');
      }
      html+='</tr>';
    });
    html+='</table>';
  });

  // No coverage
  if(d.noCoverage&&d.noCoverage.length){
    html+='<div class="empty-summary-bar" id="empty-bar" onclick="toggleEmpty()">';
    html+='<span class="toggle-icon" id="emptyIcon">▸</span> 今日无券商覆盖 <span class="empty-count">（'+d.noCoverage.length+'个市场）</span>';
    html+='</div>';
    html+='<div class="empty-summary-list" id="empty-list" style="display:none">';
    d.noCoverage.forEach(function(mkt){
      html+='<div class="section-empty">'+mkt+' · 本日无券商覆盖</div>';
    });
    html+='</div>';
  }

  // Divergences
  if(d.divergences){
    var dv=d.divergences;
    var nDvCols=dv.headers.length;
    html+='<div class="divergence">';
    html+='<h2>重点分歧</h2><table><colgroup>';
    for(var c2=0;c2<nDvCols;c2++){html+='<col style="width:'+((dv.cols&&dv.cols[c2])||'auto')+'">'};
    html+='</colgroup><tr>';
    dv.headers.forEach(function(h){html+='<th>'+h+'</th>'});
    html+='</tr>';
    dv.rows.forEach(function(row){
      if(row.length!==nDvCols)console.warn('[日报] '+date+' 「重点分歧」 行cell数('+row.length+')≠表头('+nDvCols+')');
      html+='<tr>';
      for(var i2=0;i2<nDvCols;i2++){
        var cell=row[i2];
        if(cell==null||cell==='')cell=[];
        if(typeof cell==='string')cell=['',cell];
        html+=tr(cell[0]||'',cell[1]||'');
      }
      html+='</tr>';
    });
    html+='</table></div>';
  }

  // Footer
  html+='<div class="footer">';
  html+='<span>数据来源：Outlook Research文件夹 · 24h窗口（'+d.footer.window+'）</span>';
  html+='<span>邮件数：'+d.footer.emailCount+'</span>';
  if(d.footer.omitted) html+='<span>'+d.footer.omitted+'</span>';
  html+='<span>客观数据与券商观点已严格区分，无自行补充内容</span>';
  html+='</div>';

  app.innerHTML=html;
}

function toggleEmpty(){
  var list=document.getElementById('empty-list');
  var icon=document.getElementById('emptyIcon');
  if(!list||!icon)return;
  if(list.style.display==='none'){
    list.style.display='block';
    icon.textContent='▾';
  }else{
    list.style.display='none';
    icon.textContent='▸';
  }
}

// ==================================================================
// 初始化：生成日期列表 + 默认显示最新日期
// ==================================================================
var allDates=Object.keys(REPORT_DATA).sort();

function shiftDay(n){
  var sel=document.getElementById('dateSelect');
  var idx=sel.selectedIndex+n;
  if(idx>=0&&idx<sel.options.length){
    sel.selectedIndex=idx;
    renderDay(sel.value);
  }
}

(function init(){
  var sel=document.getElementById('dateSelect');
  var hasData=allDates.length>0;
  if(!hasData){
    var opt=document.createElement('option');
    opt.text='暂无数据';
    opt.value='';
    sel.appendChild(opt);
    renderDay('');
    return;
  }
  allDates.forEach(function(dt){
    var opt=document.createElement('option');
    opt.value=dt;
    var rd=REPORT_DATA[dt];
    opt.text=dt+' ('+rd.dateCN.split('年')[1].split('月')[0]+'/'+rd.dateCN.split('月')[1].split('日')[0]+')';
    sel.appendChild(opt);
  });
  var latest=allDates[allDates.length-1];
  sel.value=latest;
  renderDay(latest);
})();
</script>
